<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<title>Poolmoon · Client Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0b0b; --panel:#151515; --panel2:#1c1c1c; --line:#2a2a2a;
    --gold:#d4af37; --gold2:#f0d27a; --goldDim:#8a7228;
    --ink:#f2f2f2; --ink2:#b5b5b5; --muted:#7c7c7c; --red:#e5484d; --green:#46a758;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  button,input,textarea,select{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .hidden{display:none !important}

  /* header */
  header{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
  header img{height:34px;display:block;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:8px 12px;font-size:14px}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  #login .card{width:100%;max-width:380px;text-align:center}
  #login img{width:80%;max-width:260px;margin:8px auto 18px;display:block}
  label{display:block;text-align:left;font-size:13px;color:var(--ink2);margin:12px 0 6px}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
  input:focus,textarea:focus{border-color:var(--goldDim)}
  textarea{min-height:90px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
  .btn.full{width:100%;margin-top:18px}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .btn.danger{background:none;color:var(--red);border:1px solid #4a1e20;font-weight:600}
  .err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}

  /* tiles */
  h2{font-size:20px;margin:18px 0 10px}
  h3{font-size:15px;color:var(--ink2);font-weight:600;margin:0 0 10px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tile .v{font-size:24px;font-weight:700;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .s{font-size:12px;color:var(--ink2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.hero{grid-column:1/-1;border-color:#3a3115;background:linear-gradient(160deg,#1a160a,#121212)}
  .tile.hero .v{font-size:32px;color:var(--gold2)}

  /* chart */
  .chart{position:relative;margin-top:10px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line);padding-top:18px}
  .bar{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;cursor:pointer}
  .bar i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;transition:opacity .15s}
  .bar:hover i,.bar.on i{background:var(--gold2)}
  .xl{display:flex;gap:6px;margin-top:6px}
  .xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
  .tip{position:absolute;top:-6px;transform:translateX(-50%);background:#000;border:1px solid var(--goldDim);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;pointer-events:none}

  /* list */
  .row{display:flex;gap:10px;align-items:center}
  .row > *{min-width:0}
  .search{flex:1}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .item:active{background:var(--panel2)}
  .item .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .amt{font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .avatar{width:38px;height:38px;border-radius:50%;background:#2a240f;color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:12px}

  /* detail */
  .back{background:none;border:0;color:var(--gold);padding:6px 0;font-size:15px;cursor:pointer}
  .dhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .dhead .avatar{width:52px;height:52px;font-size:20px}
  .dhead h2{margin:0}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0}
  .tabs button{flex:1;background:none;border:0;padding:10px;border-radius:9px;color:var(--ink2);font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--panel2);color:var(--gold2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .earn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .earn:last-child{border-bottom:0}
  .earn .d{font-size:13px;color:var(--muted)}
  .earn .note{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
  .earn .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* modal */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet .card{width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  @media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:18px}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--goldDim);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:6}
</style>
</head>

<script>
const SUPABASE_URL = "https://weirgrmsppsyotcnhdwa.supabase.co";
const SUPABASE_KEY = "sb_publishable_vxo5PVxogon3wKFtppr5uw_3CuvhKLJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let customers = [], earnings = [], current = null, tab = "earnings";
const $ = id => document.getElementById(id);
const eur = n => new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR",maximumFractionDigits: (Math.abs(n)%1 ? 2 : 0)}).format(n||0);
const fmtDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const initials = s => (s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const today = () => new Date().toISOString().slice(0,10);
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if (v!==undefined && v!==null) e.setAttribute(k,v);
  }
  for (const k of kids.flat(Infinity)) if (k!==null && k!==undefined && k!==false) e.append(k instanceof Node ? k : String(k));
  return e;
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add("hidden"),2200); }
function fail(e){ console.error(e); toast("Error: " + (e.message||e)); }

/* ---------- auth ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? showApp() : showLogin();
  sb.auth.onAuthStateChange((ev, s) => { if (ev==="SIGNED_OUT") showLogin(); });
}
function showLogin(){ $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
async function showApp(){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); await load(); go("home"); }

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("loginErr").textContent="";
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pw").value });
  if (error) $("loginErr").textContent = error.message; else showApp();
});
$("logout").onclick = () => sb.auth.signOut();

/* ---------- data ---------- */
async function load(){
  const [c, e] = await Promise.all([
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("earnings").select("*").order("earned_on",{ascending:false})
  ]);
  if (c.error) return fail(c.error); if (e.error) return fail(e.error);
  customers = c.data; earnings = e.data;
}
const totalFor = id => earnings.filter(x=>x.customer_id===id).reduce((s,x)=>s+Number(x.amount),0);

/* ---------- views ---------- */
function go(view, id){
  $("home").classList.toggle("hidden", view!=="home");
  $("detail").classList.toggle("hidden", view!=="detail");
  $("fab").classList.toggle("hidden", view!=="home");
  if (view==="home"){ current=null; renderHome(); }
  else { current = customers.find(c=>c.id===id); renderDetail(); }
  window.scrollTo(0,0);
}

function renderHome(){
  const total = earnings.reduce((s,x)=>s+Number(x.amount),0);
  const ym = today().slice(0,7);
  const lastYm = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const month = earnings.filter(x=>x.earned_on?.startsWith(ym)).reduce((s,x)=>s+Number(x.amount),0);
  const last = earnings.filter(x=>x.earned_on?.startsWith(lastYm)).reduce((s,x)=>s+Number(x.amount),0);
  const newThisMonth = customers.filter(c=>c.created_at?.startsWith(ym)).length;
  $("tTotal").textContent = eur(total);
  $("tTotalS").textContent = `${earnings.length} payment${earnings.length===1?"":"s"} logged`;
  $("tMonth").textContent = eur(month);
  $("tMonthS").textContent = `Last month: ${eur(last)}`;
  $("tClients").textContent = customers.length;
  $("tClientsS").textContent = `${newThisMonth} new this month`;
  renderChart(); renderList();
}

function renderChart(){
  const months = [];
  for (let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const vals = months.map(m=>earnings.filter(x=>x.earned_on?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0));
  const max = Math.max(...vals, 1);
  const c = $("chart"); c.innerHTML="";
  const tip = el("div",{class:"tip hidden"});
  const bars = el("div",{class:"bars",role:"img","aria-label":"Earnings per month"});
  months.forEach((m,i)=>{
    const label = new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"short",year:"numeric"});
    const b = el("div",{class:"bar",title:`${label}: ${eur(vals[i])}`}, el("i",{style:`height:${(vals[i]/max)*100}%`}));
    const show = ()=>{ bars.querySelectorAll(".bar").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      tip.textContent=`${label}: ${eur(vals[i])}`; tip.classList.remove("hidden");
      const r=b.getBoundingClientRect(), cr=c.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(r.left-cr.left+r.width/2, 60), cr.width-60)+"px"; };
    b.addEventListener("mouseenter",show); b.addEventListener("click",show);
    b.addEventListener("mouseleave",()=>{ tip.classList.add("hidden"); b.classList.remove("on"); });
    bars.append(b);
  });
  const xl = el("div",{class:"xl"}, months.map(m=>el("span",{}, new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"short"}))));
  c.append(tip, bars, xl);
}

function renderList(){
  const q = $("q").value.trim().toLowerCase();
  let rows = customers.map(c=>({...c, total: totalFor(c.id)}))
    .filter(c=>!q || [c.name,c.email,c.phone,c.country,c.notes].some(v=>(v||"").toLowerCase().includes(q)));
  const s = $("sort").value;
  if (s==="top") rows.sort((a,b)=>b.total-a.total);
  if (s==="az") rows.sort((a,b)=>a.name.localeCompare(b.name));
  const list = $("list"); list.innerHTML="";
  if (!customers.length){ list.append(el("div",{class:"empty"},"No clients yet. Tap + to add your first one.")); return; }
  if (!rows.length){ list.append(el("div",{class:"empty"},"No matches.")); return; }
  rows.forEach(c=>list.append(
    el("div",{class:"item",onclick:()=>go("detail",c.id)},
      el("div",{class:"row",style:"flex:1"},
        el("div",{class:"avatar"},initials(c.name)),
        el("div",{style:"min-width:0"}, el("div",{class:"n"},c.name), el("div",{class:"m"},[c.country,c.email].filter(Boolean).join(" · ")||"No details yet"))),
      el("div",{class:"amt"},eur(c.total)))
  ));
}
$("q").oninput = renderList; $("sort").onchange = renderList;

function renderDetail(){
  const c = current, d = $("detail"); d.innerHTML="";
  if (!c) return go("home");
  const list = earnings.filter(x=>x.customer_id===c.id);
  const total = list.reduce((s,x)=>s+Number(x.amount),0);
  d.append(
    el("button",{class:"back",onclick:()=>go("home")},"‹ All clients"),
    el("div",{class:"dhead"}, el("div",{class:"avatar"},initials(c.name)),
      el("div",{}, el("h2",{},c.name), el("div",{style:"color:var(--muted);font-size:13px"},"Client since "+fmtDate(c.created_at?.slice(0,10))))),
    el("div",{class:"tiles"},
      el("div",{class:"tile hero"}, el("div",{class:"k"},"Total earned"), el("div",{class:"v"},eur(total)),
        el("div",{class:"s"}, list.length ? `${list.length} payment${list.length===1?"":"s"} · last on ${fmtDate(list[0].earned_on)}` : "Nothing logged yet"))),
    el("div",{class:"tabs"},
      el("button",{class:tab==="earnings"?"on":"",onclick:()=>{tab="earnings";renderDetail();}},"Earnings"),
      el("button",{class:tab==="info"?"on":"",onclick:()=>{tab="info";renderDetail();}},"Info"))
  );
  if (tab==="earnings"){
    d.append(el("button",{class:"btn full",style:"margin-top:0",onclick:()=>earningForm(c)},"+ Log earnings"));
    const box = el("div",{class:"card",style:"margin-top:12px;padding:6px 16px"});
    if (!list.length) box.append(el("div",{class:"empty",style:"border:0"},"No earnings logged yet."));
    list.forEach(x=>box.append(el("div",{class:"earn"},
      el("div",{style:"min-width:0"}, el("div",{class:"d"},fmtDate(x.earned_on)), x.note ? el("div",{class:"note"},x.note) : null),
      el("div",{class:"row"}, el("div",{class:"a"},eur(Number(x.amount))),
        el("button",{class:"x",title:"Delete",onclick:()=>delEarning(x)},"×")))));
    d.append(box);
  } else {
    const info = [["Email",c.email,"mailto:"],["Phone",c.phone,"tel:"],["Country",c.country],["Notes",c.notes]];
    d.append(el("div",{class:"card"}, info.map(([k,v,href])=>el("div",{style:"padding:10px 0;border-bottom:1px solid var(--line)"},
      el("div",{style:"font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em"},k),
      v ? (href ? el("a",{href:href+v,style:"color:var(--gold2);text-decoration:none"},v) : el("div",{style:"white-space:pre-wrap;margin-top:4px"},v))
        : el("div",{style:"color:var(--muted);margin-top:4px"},"—")))));
    d.append(el("div",{class:"actions"},
      el("button",{class:"btn sec",onclick:()=>customerForm(c)},"Edit info"),
      el("button",{class:"btn danger",onclick:()=>delCustomer(c)},"Delete client")));
  }
}

/* ---------- forms ---------- */
function openSheet(title, fields, onSave){
  const s = $("sheet"); s.innerHTML="";
  const form = el("form",{class:"card"}, el("h2",{style:"margin-top:0"},title), fields,
    el("div",{class:"actions"},
      el("button",{class:"btn",type:"submit",style:"flex:1"},"Save"),
      el("button",{class:"btn sec",type:"button",onclick:closeSheet},"Cancel")));
  form.addEventListener("submit", async e=>{ e.preventDefault(); const b=form.querySelector("[type=submit]"); b.disabled=true; b.textContent="Saving…";
    try{ await onSave(new FormData(form)); closeSheet(); }catch(err){ fail(err); b.disabled=false; b.textContent="Save"; } });
  s.append(form); s.classList.remove("hidden");
  s.onclick = e=>{ if (e.target===s) closeSheet(); };
  setTimeout(()=>form.querySelector("input")?.focus(),50);
}
function closeSheet(){ $("sheet").classList.add("hidden"); }
const field = (lab,name,val="",type="text",extra={}) => [el("label",{},lab),
  type==="textarea" ? Object.assign(el("textarea",{name}),{value:val||""}) : el("input",{name,type,value:val??"",...extra})];

function customerForm(c){
  openSheet(c ? "Edit client" : "New client", [
    field("Name *","name",c?.name,"text",{required:""}),
    field("Email","email",c?.email,"email"),
    field("Phone","phone",c?.phone,"tel"),
    field("Country","country",c?.country),
    field("Notes","notes",c?.notes,"textarea")
  ], async fd=>{
    const row = Object.fromEntries(["name","email","phone","country","notes"].map(k=>[k,(fd.get(k)||"").trim()||null]));
    if (c){ const {data,error}=await sb.from("customers").update(row).eq("id",c.id).select().single(); if(error) throw error;
      Object.assign(c,data); toast("Saved"); renderDetail(); }
    else { const {data,error}=await sb.from("customers").insert(row).select().single(); if(error) throw error;
      customers.unshift(data); toast("Client added"); tab="earnings"; go("detail",data.id); }
  });
}
function earningForm(c){
  openSheet("Log earnings · "+c.name, [
    field("Amount (€) *","amount","","number",{required:"",step:"0.01",inputmode:"decimal"}),
    field("Date","earned_on",today(),"date"),
    field("Note","note","")
  ], async fd=>{
    const row = { customer_id:c.id, amount:Number(fd.get("amount")), earned_on:fd.get("earned_on")||today(), note:(fd.get("note")||"").trim()||null };
    const {data,error}=await sb.from("earnings").insert(row).select().single(); if(error) throw error;
    earnings.push(data); earnings.sort((a,b)=>b.earned_on.localeCompare(a.earned_on)); toast("Logged "+eur(row.amount)); renderDetail();
  });
}
async function delEarning(x){
  if (!confirm(`Delete ${eur(Number(x.amount))} from ${fmtDate(x.earned_on)}?`)) return;
  const {error}=await sb.from("earnings").delete().eq("id",x.id); if(error) return fail(error);
  earnings = earnings.filter(e=>e.id!==x.id); renderDetail();
}
async function delCustomer(c){
  if (!confirm(`Delete ${c.name} and all their earnings? This can't be undone.`)) return;
  const {error}=await sb.from("customers").delete().eq("id",c.id); if(error) return fail(error);
  customers = customers.filter(x=>x.id!==c.id); earnings = earnings.filter(e=>e.customer_id!==c.id); toast("Client deleted"); go("home");
}
$("fab").onclick = ()=>customerForm(null);

boot();
</script>
</body>
</html>

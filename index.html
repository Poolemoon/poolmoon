<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<title>Poolmoon · Client Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --panel2:#1c1c1c; --line:#2a2a2a;
    --gold:#d4af37; --gold2:#f3d27a; --goldDim:#8a7228;
    --ink:#f2f2f2; --ink2:#b5b5b5; --muted:#7c7c7c; --red:#ff4d5a;
    --prep:#ffd60a; --play:#30e37a; --fin:#ff3b4f;
    --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
    background:radial-gradient(40% 30% at 85% 0%,rgba(212,175,55,.10),transparent 70%),radial-gradient(35% 30% at 0% 100%,rgba(212,175,55,.06),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(-3%,2%) scale(1.05)}}
  button,input,textarea,select{font:inherit;color:inherit}
  #embers{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
  #login,#app{position:relative;z-index:1}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .hidden{display:none !important}

  /* animations */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  @keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(212,175,55,.35))}50%{filter:drop-shadow(0 0 16px rgba(243,210,122,.7))}}
  .rise{animation:rise .55s var(--ease) both}
  .stagger > *{animation:rise .5s var(--ease) both}
  .stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.07s}
  .stagger > *:nth-child(3){animation-delay:.12s}.stagger > *:nth-child(4){animation-delay:.17s}
  .stagger > *:nth-child(5){animation-delay:.22s}.stagger > *:nth-child(6){animation-delay:.27s}
  .stagger > *:nth-child(7){animation-delay:.32s}.stagger > *:nth-child(n+8){animation-delay:.36s}

  /* header */
  header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
  header img{height:34px;display:block;cursor:pointer;mix-blend-mode:screen}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-width:0}
  .who .rk{color:var(--gold2);font-weight:700;letter-spacing:.08em;font-size:11px;border:1px solid var(--goldDim);border-radius:999px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
  .ghost:active{border-color:var(--goldDim);color:var(--gold2)}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:linear-gradient(180deg,#161616,#121212);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  #login .card{width:100%;max-width:380px;text-align:center;animation:rise .7s var(--ease) both}
  #login img{width:80%;max-width:260px;margin:8px auto 18px;display:block;mix-blend-mode:screen;animation:glow 3.5s ease-in-out infinite}
  label{display:block;text-align:left;font-size:13px;color:var(--ink2);margin:12px 0 6px}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus,textarea:focus,select:focus{border-color:var(--goldDim);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
  textarea{min-height:90px;resize:vertical}
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s;box-shadow:0 6px 24px rgba(212,175,55,.18)}
  .btn::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-20deg);animation:shine 3.8s ease-in-out infinite}
  .btn:active{transform:scale(.97)}
  .btn.full{width:100%;margin-top:18px}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
  .btn.sec::after,.btn.danger::after{display:none}
  .btn.danger{background:none;color:var(--red);border:1px solid #4a1e20;font-weight:600;box-shadow:none}
  .err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* welcome overlay */
  #welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;
    background:radial-gradient(60% 45% at 50% 45%,#2a210a 0%,#0d0b06 55%,#050505 100%);animation:fadeIn .4s ease both;overflow:hidden;cursor:pointer}
  #welcome.out{animation:wOut .7s var(--ease) forwards}
  @keyframes wOut{to{opacity:0;transform:scale(1.08);filter:blur(6px)}}
  #welcome .rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:45%;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(243,210,122,.07) 0deg 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;
    -webkit-mask:radial-gradient(circle,#000 0%,transparent 55%);mask:radial-gradient(circle,#000 0%,transparent 55%)}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold2);opacity:0;animation:float 3.2s ease-out forwards}
  @keyframes float{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-46vh) scale(1.2)}}
  .crown{width:120px;height:90px;animation:crownIn 1s var(--ease) .2s both, glow 2.6s ease-in-out 1.2s infinite;position:relative}
  @keyframes crownIn{0%{opacity:0;transform:translateY(-60px) rotate(-12deg) scale(.4)}60%{opacity:1;transform:translateY(6px) rotate(3deg) scale(1.08)}100%{transform:none}}
  .wl{font-size:15px;letter-spacing:.5em;color:var(--ink2);margin-top:22px;text-transform:uppercase;animation:rise .7s var(--ease) .7s both}
  .wname{font-size:clamp(46px,15vw,92px);font-weight:900;letter-spacing:.06em;margin:6px 0 4px;line-height:1.05;filter:drop-shadow(0 0 18px rgba(243,210,122,.35))}
  @keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
  .wname span{display:inline-block;background:linear-gradient(100deg,#9c7a22 0%,#f3d27a 30%,#fff6d6 45%,#f3d27a 60%,#b18a2a 100%);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:letter .6s var(--ease) var(--d) both, sheen 3s linear 2s infinite}
  @keyframes letter{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
  .rank{position:relative;overflow:hidden;margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;
    border:1.5px solid var(--gold);color:var(--gold2);font-weight:800;letter-spacing:.35em;font-size:15px;text-transform:uppercase;
    background:linear-gradient(180deg,rgba(243,210,122,.12),rgba(212,175,55,.03));box-shadow:0 0 24px rgba(212,175,55,.35),inset 0 0 14px rgba(212,175,55,.15);
    animation:pop .7s var(--ease) 1.5s both}
  .rank::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s ease-in-out 2.1s infinite}
  .rank svg{width:18px;height:14px}
  .tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;animation:fadeIn 1s ease 2.6s both}

  /* tiles */
  h2{font-size:20px;margin:20px 0 10px}
  h3{font-size:15px;color:var(--ink2);font-weight:600;margin:0 0 10px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{position:relative;overflow:hidden;background:linear-gradient(180deg,#161616,#121212);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tile .v{font-size:24px;font-weight:800;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .s{font-size:12px;color:var(--ink2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.hero{grid-column:1/-1;border-color:#3a3115;background:linear-gradient(160deg,#1d180a,#111)}
  .tile.hero::after{content:"";position:absolute;top:0;left:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(243,210,122,.08),transparent);animation:shine 6s ease-in-out infinite}
  .tile.hero .v{font-size:34px;color:var(--gold2);text-shadow:0 0 24px rgba(243,210,122,.25)}

  /* status */
  .st{--c:var(--prep);display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
    box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 8px color-mix(in srgb,var(--c) 18%,transparent);
    text-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);white-space:nowrap}
  .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 14px var(--c);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.55}}
  .st.preparing{--c:var(--prep)} .st.playing{--c:var(--play)} .st.finished{--c:var(--fin)}

  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .chip{--c:var(--gold2);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .25s var(--ease)}
  .chip b{display:block;font-size:22px;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent);font-variant-numeric:tabular-nums}
  .chip span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .chip.preparing{--c:var(--prep)}.chip.playing{--c:var(--play)}.chip.finished{--c:var(--fin)}
  .chip.on{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 12%,transparent);transform:translateY(-2px)}

  /* chart */
  .chart{position:relative;margin-top:10px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line);padding-top:18px}
  .bar{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;cursor:pointer}
  .bar i{display:block;width:100%;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom;animation:grow .9s var(--ease) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bar.on i{box-shadow:0 0 16px rgba(243,210,122,.5)}
  .xl{display:flex;gap:6px;margin-top:6px}
  .xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
  .tip{position:absolute;top:-6px;transform:translateX(-50%);background:#000;border:1px solid var(--goldDim);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;pointer-events:none;animation:fadeIn .15s}

  /* list */
  .row{display:flex;gap:10px;align-items:center}
  .row > *{min-width:0}
  .search{flex:1}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#161616,#121212);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
  .item:active{transform:scale(.98);border-color:var(--goldDim)}
  .item > .row{flex:1;min-width:0}
  .item .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
  .item .amt{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .avatar{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a300f,#1d1808);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;border:1px solid #3a3115}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:12px}

  /* detail */
  .back{background:none;border:0;color:var(--gold);padding:6px 0;font-size:15px;cursor:pointer}
  .dhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .dhead .avatar{width:56px;height:56px;font-size:20px}
  .dhead h2{margin:0 0 6px}
  .stpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
  .stpick button{--c:var(--prep);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 4px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease)}
  .stpick button.preparing{--c:var(--prep)}.stpick button.playing{--c:var(--play)}.stpick button.finished{--c:var(--fin)}
  .stpick button.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);text-shadow:0 0 10px var(--c);
    box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 18%,transparent);transform:translateY(-2px)}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0;position:relative}
  .tabs button{flex:1;background:none;border:0;padding:10px;border-radius:9px;color:var(--ink2);font-weight:700;cursor:pointer;transition:all .25s var(--ease)}
  .tabs button.on{background:var(--panel2);color:var(--gold2)}
  .earn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .earn:last-child{border-bottom:0}
  .earn .d{font-size:13px;color:var(--muted)}
  .earn .note{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
  .earn .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .info{padding:11px 0;border-bottom:1px solid var(--line)}
  .info:last-child{border-bottom:0}
  .info .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .info .v{margin-top:4px;white-space:pre-wrap}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fadeIn .25s}
  .sheet .card{width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:up .4s var(--ease) both}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:20px}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--goldDim);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;animation:rise .3s var(--ease);box-shadow:0 0 20px rgba(212,175,55,.2)}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:30px;z-index:6;animation:pop .6s var(--ease) .4s both;box-shadow:0 8px 28px rgba(212,175,55,.35)}

  /* progress (admin) */
  .prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .upd{padding:12px 0;border-bottom:1px solid var(--line)}
  .upd:last-child{border-bottom:0}
  .upd .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .upd .p{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upd .b{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .upd .d{font-size:12px;color:var(--muted);margin-top:3px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--play);letter-spacing:.1em;text-transform:uppercase}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--play);box-shadow:0 0 8px var(--play);animation:pulse 1.6s ease-in-out infinite}
  .cred{background:var(--panel2);border:1px dashed var(--goldDim);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
  .flash{animation:flash 1.4s var(--ease)}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(243,210,122,.0)}25%{box-shadow:0 0 0 3px rgba(243,210,122,.55),0 0 28px rgba(243,210,122,.4)}100%{box-shadow:0 0 0 0 rgba(243,210,122,0)}}

  .ghost{white-space:nowrap}
  @media(max-width:420px){ header .wrap{gap:6px} .who .rk{font-size:10px;padding:3px 6px;letter-spacing:.04em} .ghost{padding:8px 10px} header img{height:30px} }
  /* milestones */
  .bell{position:relative;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:10px;width:40px;height:38px;font-size:17px;cursor:pointer;transition:border-color .2s}
  .bell.has{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.35);animation:ring 2.4s ease-in-out infinite}
  @keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
  .bell .dot{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(243,210,122,.7);animation:pop .5s var(--ease)}
  .msbanner{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px;border-radius:var(--r);border:1px solid var(--gold);cursor:pointer;
    background:linear-gradient(120deg,#2a210a,#141008);box-shadow:0 0 22px rgba(212,175,55,.25);position:relative;overflow:hidden}
  .msbanner::after{content:"";position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(243,210,122,.18),transparent);animation:shine 3.2s ease-in-out infinite}
  .msbanner .big{font-size:28px;animation:glow 2.4s ease-in-out infinite}
  .ms{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#161616,#121212);cursor:pointer}
  .ms.new{border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.22)}
  .ms .amt{font-size:20px;font-weight:900;color:var(--gold2);text-shadow:0 0 14px rgba(243,210,122,.4);white-space:nowrap}
  .ms .tag{font-size:10px;font-weight:900;letter-spacing:.12em;color:#111;background:var(--gold2);border-radius:999px;padding:2px 7px;margin-inline-start:6px;vertical-align:middle}

  /* client side (Persian, RTL) */
  .fa, .fa input, .fa button, .fa textarea{font-family:Vazirmatn,Tahoma,-apple-system,"Segoe UI",sans-serif}
  .fa{direction:rtl}
  .fa label{text-align:right}
  .fa .tile .k,.fa .info .k,.fa .st,.fa .chip span{letter-spacing:0;text-transform:none}
  .fa .st{font-size:12px}
  #welcome.fa .wl,#welcome.fa .rank,#welcome.fa .tap{letter-spacing:0;text-transform:none}
  #welcome.fa .wname{letter-spacing:0;font-size:clamp(40px,13vw,80px)}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .lb{position:relative;overflow:hidden;border-color:#3a3115}
  .lb .soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2;
    background:radial-gradient(70% 60% at 50% 50%,rgba(10,10,10,.55),rgba(10,10,10,.85))}
  .lb .soon b{font-size:22px;color:var(--gold2);text-shadow:0 0 18px rgba(243,210,122,.5)}
  .lb .soon .pill{position:relative;overflow:hidden;border:1.5px solid var(--gold);color:var(--gold2);border-radius:999px;padding:6px 18px;font-weight:800;
    box-shadow:0 0 20px rgba(212,175,55,.35),inset 0 0 12px rgba(212,175,55,.15);animation:glow 2.6s ease-in-out infinite}
  .lb .soon .pill::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s ease-in-out infinite}
  .lb .ghostrow{display:flex;align-items:center;gap:10px;padding:10px 0;filter:blur(3px);opacity:.55}
  .lb .ghostrow i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#2a2a2a,#3a3115,#2a2a2a)}
  .lb .medal{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
  .trophy{font-size:40px;animation:glow 2.6s ease-in-out infinite}

  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important} }
</style>
</head>

  if (s<60) return "just now"; if (s<3600) return Math.floor(s/60)+" min ago"; if (s<86400) return Math.floor(s/3600)+" h ago";
  const d=Math.floor(s/86400); return d===1 ? "yesterday" : d+" days ago"; }
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if (v!==undefined && v!==null) e.setAttribute(k,v);
  }
  for (const k of kids.flat(Infinity)) if (k!==null && k!==undefined && k!==false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const svgUse = (id,w,h) => { const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 120 90"); if(w){s.style.width=w;s.style.height=h;}
  const u=document.createElementNS("http://www.w3.org/2000/svg","use"); u.setAttribute("href","#"+id); s.append(u); return s; };
const badge = s => el("span",{class:"st "+(s||"preparing")}, stLabel(s));
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); t.style.animation="none"; t.offsetHeight; t.style.animation=""; clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add("hidden"),2400); }
function fail(e){ console.error(e); toast("Error: " + (e.message||e)); }
function countUp(node, to, fmt){
  const dur=900, t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); node.textContent=fmt(to*e); if(p<1) requestAnimationFrame(step); else node.textContent=fmt(to); };
  requestAnimationFrame(step);
}

/* ---------- data ---------- */
async function load(){
  const [c, e, u, m] = await Promise.all([
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("earnings").select("*").order("earned_on",{ascending:false}),
    sb.from("client_updates").select("*").order("created_at",{ascending:false}).limit(5000),
    sb.from("milestones").select("*").order("created_at",{ascending:false}).limit(1000)
  ]);
  if (c.error) return fail(c.error); if (e.error) return fail(e.error); if (u.error) return fail(u.error);
  customers = c.data; earnings = e.data; updates = u.data;
  milestones = m.error ? [] : m.data; if (m.error) console.error(m.error);
}

/* live: client updates appear on the panel instantly */
function startLive(){
  if (liveCh) sb.removeChannel(liveCh);
  liveCh = sb.channel("panel-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"customers"}, p=>{
      if (p.eventType==="DELETE"){ customers = customers.filter(x=>x.id!==p.old.id); }
      else { const i = customers.findIndex(x=>x.id===p.new.id);
        if (i>=0) customers[i] = {...customers[i], ...p.new}; else customers.unshift(p.new);
        if (current && current.id===p.new.id) current = customers.find(x=>x.id===p.new.id); }
      refreshView(p.new?.id);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"milestones"}, p=>{
      if (milestones.some(x=>x.id===p.new.id)) return;
      milestones.unshift(p.new);
      const c = customers.find(x=>x.id===p.new.customer_id);
      setTimeout(()=>toast(`🎉 ${(c && c.name) || "A client"} reached ${eur(p.new.milestone)}!`), 2600);
      renderBell();
      if (!$("milestones").classList.contains("hidden")) renderMilestones();
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"milestones"}, p=>{
      const i = milestones.findIndex(x=>x.id===p.new.id); if (i>=0) milestones[i] = p.new; renderBell();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"client_updates"}, p=>{
      if (!updates.some(x=>x.id===p.new.id)) updates.unshift(p.new);
      const c = customers.find(x=>x.id===p.new.customer_id);
      toast(`📈 ${(c && c.name) || p.new.first_name}: ${p.new.progress} · ${eur(Number(p.new.freecash_balance))}`);
      refreshView(p.new.customer_id);
    })
    .subscribe();
}
function refreshView(id){
  if ($("app").classList.contains("hidden")) return;
  if (!$("sheet").classList.contains("hidden")) return; // don't disturb an open form
  if (current){ if (!customers.some(x=>x.id===current.id)) return go("home"); if (current.id===id) renderDetail(); return; }
  renderChips(); renderList();
  const item = document.querySelector(`[data-id="${id}"]`); if (item){ item.classList.add("flash"); }
  countUp($("tClients"), customers.length, n=>Math.round(n));
}
const totalFor = id => earnings.filter(x=>x.customer_id===id).reduce((s,x)=>s+Number(x.amount),0);

/* ---------- views ---------- */
function go(view, id){
  $("home").classList.toggle("hidden", view!=="home");
  $("detail").classList.toggle("hidden", view!=="detail");
  $("milestones").classList.toggle("hidden", view!=="milestones");
  $("fab").classList.toggle("hidden", view!=="home");
  if (view==="home"){ current=null; renderHome(); }
  else if (view==="milestones"){ current=null; renderMilestones(); }
  else { current = customers.find(c=>c.id===id); renderDetail(true); }
  window.scrollTo({top:0});
}

function renderHome(){
  const total = earnings.reduce((s,x)=>s+Number(x.amount),0);
  const ym = today().slice(0,7);
  const lastYm = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const month = earnings.filter(x=>x.earned_on?.startsWith(ym)).reduce((s,x)=>s+Number(x.amount),0);
  const last = earnings.filter(x=>x.earned_on?.startsWith(lastYm)).reduce((s,x)=>s+Number(x.amount),0);
  const newThisMonth = customers.filter(c=>c.created_at?.startsWith(ym)).length;
  // replay entrance animations
  const t=$("tiles"); t.classList.remove("stagger"); t.offsetWidth; t.classList.add("stagger");
  countUp($("tTotal"), total, eur);
  $("tTotalS").textContent = `${earnings.length} payment${earnings.length===1?"":"s"} logged`;
  countUp($("tMonth"), month, eur);
  $("tMonthS").textContent = `Last month: ${eur(last)}`;
  countUp($("tClients"), customers.length, n=>Math.round(n));
  $("tClientsS").textContent = `${newThisMonth} new this month`;
  renderChips(); renderChart(); renderList(); renderBell();
}

function renderChips(){
  const c=$("chips"); c.innerHTML="";

  [["all","All",customers.length], ...STATUSES.map(([k,l])=>[k,l,count(k)])].forEach(([k,l,n])=>
    c.append(el("div",{class:`chip ${k} ${filter===k?"on":""}`,onclick:()=>{filter=filter===k&&k!=="all"?"all":k; renderChips(); renderList();}}, el("b",{},n), el("span",{},l))));

function renderChart(){
  const months = [];
  for (let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const vals = months.map(m=>earnings.filter(x=>x.earned_on?.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0));
  const max = Math.max(...vals, 1);
  const c = $("chart"); c.innerHTML="";
  const tip = el("div",{class:"tip hidden"});
  const bars = el("div",{class:"bars",role:"img","aria-label":"Earnings per month"});
  months.forEach((m,i)=>{
    const label = new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"short",year:"numeric"});
    const b = el("div",{class:"bar",title:`${label}: ${eur(vals[i])}`}, el("i",{style:`height:${(vals[i]/max)*100}%;animation-delay:${.35+i*.08}s`}));
    const show = ()=>{ bars.querySelectorAll(".bar").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      tip.textContent=`${label}: ${eur(vals[i])}`; tip.classList.remove("hidden");
      const r=b.getBoundingClientRect(), cr=c.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(r.left-cr.left+r.width/2, 60), cr.width-60)+"px"; };
    b.addEventListener("mouseenter",show); b.addEventListener("click",show);
    b.addEventListener("mouseleave",()=>{ tip.classList.add("hidden"); b.classList.remove("on"); });
    bars.append(b);
  });
  const xl = el("div",{class:"xl"}, months.map(m=>el("span",{}, new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"short"}))));
  c.append(tip, bars, xl);
}

async function setStatus(c, s){
  if ((c.status||"preparing")===s) return;
  const prev=c.status; c.status=s; renderDetail();
  const {error}=await sb.from("customers").update({status:s}).eq("id",c.id);
  if (error){ c.status=prev; renderDetail(); return fail(error); }
  toast(`${c.name} → ${stLabel(s)}`);
}

        : el("div",{class:"v",style:"color:var(--muted)"},"—")))));
    body.append(el("div",{class:"actions"},
      el("button",{class:"btn sec",onclick:()=>customerForm(c)},"Edit info"),
      el("button",{class:"btn danger",onclick:()=>delCustomer(c)},"Delete client")));
  }
  d.append(body);
}

/* ---------- forms ---------- */
function openSheet(title, fields, onSave){
  const s = $("sheet"); s.innerHTML="";
  const form = el("form",{class:"card"}, el("h2",{style:"margin-top:0"},title), fields,
    el("div",{class:"actions"},
      el("button",{class:"btn",type:"submit",style:"flex:1"},"Save"),
      el("button",{class:"btn sec",type:"button",onclick:closeSheet},"Cancel")));
  form.addEventListener("submit", async e=>{ e.preventDefault(); const b=form.querySelector("[type=submit]"); b.disabled=true; b.textContent="Saving…";
    try{ await onSave(new FormData(form)); closeSheet(); }catch(err){ fail(err); b.disabled=false; b.textContent="Save"; } });
  s.append(form); s.classList.remove("hidden");
  s.onclick = e=>{ if (e.target===s) closeSheet(); };
}
function closeSheet(){ $("sheet").classList.add("hidden"); }
const field = (lab,name,val="",type="text",extra={}) => [el("label",{},lab),
  type==="textarea" ? Object.assign(el("textarea",{name}),{value:val||""}) : el("input",{name,type,value:val??"",...extra})];
const statusField = val => [el("label",{},"Status"),
  el("select",{name:"status"}, STATUSES.map(([k,l])=>{ const o=el("option",{value:k},l); if((val||"preparing")===k) o.selected=true; return o; }))];

function customerForm(c){
  openSheet(c ? "Edit client" : "New client", [
    field("Name *","name",c?.name,"text",{required:""}),
    statusField(c?.status),
    field("Active game","active_game",c?.active_game,"text",{placeholder:"e.g. Jelly Busters"}),
    field("Phone model","device",c?.device,"text",{placeholder:"e.g. Galaxy S25 FE"}),
    field("Email","email",c?.email,"email"),
    field("Phone number","phone",c?.phone,"tel"),
    field("Country","country",c?.country),
    field("Notes","notes",c?.notes,"textarea"),
    c ? null : el("div",{class:"card",style:"margin-top:16px;border-color:#3a3115"},
      el("h3",{style:"margin:0"},"🔑 Client login (optional)"),
      el("div",{style:"font-size:13px;color:var(--muted);margin-top:4px"},"Fill these in to give the client their own login right away. You can also do it later."),
      ...loginFields())
  ], async fd=>{
    const keys=["name","status","active_game","device","email","phone","country","notes"];
    const row = Object.fromEntries(keys.map(k=>[k,(fd.get(k)||"").trim()||null]));
    row.status = row.status || "preparing";
    if (c){ const {data,error}=await sb.from("customers").update(row).eq("id",c.id).select().single(); if(error) throw error;
      Object.assign(c,data); toast("Saved"); renderDetail(); }
    else {
      const u=(fd.get("username")||"").trim(), p=fd.get("password")||"";
      if (u || p) checkLogin(u,p);
      const {data,error}=await sb.from("customers").insert(row).select().single(); if(error) throw error;
      if (!customers.some(x=>x.id===data.id)) customers.unshift(data);
      if (u){
        try { const res = await createLogin({ username:u, password:p, customer_id:data.id });
          Object.assign(customers.find(x=>x.id===data.id), res.customer);
          tab="progress"; go("detail",data.id); setTimeout(()=>showCreds(u,p),50); return;
        } catch(err){ tab="progress"; go("detail",data.id); setTimeout(()=>toast("Client saved, but login failed: "+err.message),60); return; }
      }
      toast("Client added ✨"); tab="earnings"; go("detail",data.id);
    }
  });
}

/* ---------- client logins ---------- */
const genPw = () => { const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r=crypto.getRandomValues(new Uint32Array(10)); return [...r].map(n=>a[n%a.length]).join(""); };
function loginFields(){
  const pw = el("input",{name:"password",type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"at least 8 characters"});
  return [el("label",{},"Username"),
    el("input",{name:"username",type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"e.g. ali.r"}),
    el("label",{},"Password"),
    el("div",{class:"row"}, pw, el("button",{class:"btn sec",type:"button",style:"flex:none",onclick:()=>{pw.value=genPw();}},"🎲 Generate"))];
}
function checkLogin(u,p){
  if (!/^[a-z0-9._-]{3,30}$/i.test(u)) throw new Error("Username: 3–30 letters, numbers, . _ or -");
  if (p.length<8) throw new Error("Password must be at least 8 characters");
}
async function createLogin(body){
  const { data, error } = await sb.functions.invoke("create-client", { body });
  if (error){ let msg=error.message; try{ msg=(await error.context.json()).error||msg; }catch(_){} throw new Error(msg); }
  if (data?.error) throw new Error(data.error);
  return data;
}
function loginForm(c){
  openSheet("Create login · "+c.name, [
    el("div",{style:"font-size:14px;color:var(--ink2)"},"The client logs in on the same page as you, but only sees their own progress page (in Persian)."),
    ...loginFields()
  ], async fd=>{
    const u=(fd.get("username")||"").trim(), p=fd.get("password")||"";
    checkLogin(u,p);
    const res = await createLogin({ username:u, password:p, customer_id:c.id });
    Object.assign(c, res.customer); renderDetail();
    setTimeout(()=>showCreds(u,p),50);
  });
}
function showCreds(u,p){
  const text = `Poolmoon · پول‌مون\n${location.origin+location.pathname}\nUsername / نام کاربری: ${u.toLowerCase()}\nPassword / رمز عبور: ${p}`;
  const s=$("sheet"); s.innerHTML="";
  const copyBtn = el("button",{class:"btn",type:"button",style:"flex:1",onclick:async()=>{ try{ await navigator.clipboard.writeText(text); copyBtn.textContent="Copied ✓"; }catch(_){ toast("Copy failed — select the text instead"); } }},"📋 Copy");
  s.append(el("div",{class:"card"},
    el("h2",{style:"margin-top:0"},"Login created ✨"),
    el("div",{style:"font-size:14px;color:var(--ink2);margin-bottom:12px"},"Send this to the client. Save the password now — it can't be shown again."),
    el("div",{class:"cred"},text),
    el("div",{class:"actions"}, copyBtn, el("button",{class:"btn sec",type:"button",onclick:closeSheet},"Done"))));
  s.classList.remove("hidden"); s.onclick = e=>{ if (e.target===s) closeSheet(); };
}
function earningForm(c){
  openSheet("Log earnings · "+c.name, [
    field("Amount (€) *","amount","","number",{required:"",step:"0.01",inputmode:"decimal"}),
    field("Date","earned_on",today(),"date"),
    field("Note","note","",'text',{placeholder:"e.g. Level 50 reward"})
  ], async fd=>{
    const row = { customer_id:c.id, amount:Number(fd.get("amount")), earned_on:fd.get("earned_on")||today(), note:(fd.get("note")||"").trim()||null };
    const {data,error}=await sb.from("earnings").insert(row).select().single(); if(error) throw error;
    earnings.push(data); earnings.sort((a,b)=>b.earned_on.localeCompare(a.earned_on)); toast("Logged "+eur(row.amount)+" 💰"); renderDetail(true);
  });
}
async function delEarning(x){
  if (!confirm(`Delete ${eur(Number(x.amount))} from ${fmtDate(x.earned_on)}?`)) return;
  const {error}=await sb.from("earnings").delete().eq("id",x.id); if(error) return fail(error);
  earnings = earnings.filter(e=>e.id!==x.id); renderDetail();
}
async function delCustomer(c){
  if (!confirm(`Delete ${c.name} and all their earnings? This can't be undone.`)) return;
  const {error}=await sb.from("customers").delete().eq("id",c.id); if(error) return fail(error);
  customers = customers.filter(x=>x.id!==c.id); earnings = earnings.filter(e=>e.customer_id!==c.id); toast("Client deleted"); go("home");
}
$("fab").onclick = ()=>customerForm(null);

/* ---------- CLIENT AREA (Persian) ---------- */
let cMe = null, cUpdates = [];
const FA_ST = { preparing:"در حال آماده‌سازی", playing:"در حال بازی", finished:"تمام‌شده" };
const faEur = n => new Intl.NumberFormat("fa-IR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const faTime = t => t ? new Date(t).toLocaleString("fa-IR",{dateStyle:"medium",timeStyle:"short"}) : "";
const toLatin = s => String(s||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
function parseMoney(s){
  s = toLatin(s).replace(/[\s€]/g,"").replace(/٫/g,",");
  if (s.includes(",") && s.includes(".")){ const dec = s.lastIndexOf(",")>s.lastIndexOf(".") ? "," : "."; s = s.split(dec==="," ? "." : ",").join(""); }
  s = s.replace(",",".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(Number(s)*100)/100;
}

async function cLoad(){
  const [c,u] = await Promise.all([

function progressForm(last){
  const v = k => (last && last[k]) || (k==="phone_model" ? cMe.device : k==="game" ? cMe.active_game : cMe[k]) || "";
  const f = (lab,name,val,extra={}) => [el("label",{},lab), el("input",{name,type:"text",value:val,required:"",maxlength:"60",autocomplete:"off",...extra})];
  const form = el("form",{class:"card",style:"margin-top:12px"},
    el("h2",{style:"margin-top:0"},"ثبت پیشرفت جدید"),
    el("div",{style:"font-size:14px;color:var(--ink2)"},"هر بار که در بازی پیشرفت کردید، اینجا ثبت کنید تا تیم پول‌مون در جریان باشد."),
    el("div",{class:"two"}, el("div",{},f("نام","first_name",v("first_name"))), el("div",{},f("نام خانوادگی","last_name",v("last_name")))),
    f("نام کاربری","game_username",v("game_username"),{autocapitalize:"none",spellcheck:"false"}),
    f("مدل گوشی","phone_model",v("phone_model"),{placeholder:"مثلاً Galaxy S25 FE"}),
    f("بازی فعلی","game",v("game"),{placeholder:"مثلاً Jelly Busters",maxlength:"80"}),
    f("پیشرفت در بازی","progress","",{placeholder:"مثلاً بانک ۵ یا لول ۹۰۰",maxlength:"80"}),
    f("موجودی فعلی فری‌کش (یورو)","balance","",{placeholder:"مثلاً 93,83",inputmode:"decimal",style:"direction:ltr;text-align:right"}),
    el("div",{style:"font-size:13px;color:var(--gold2);margin-top:8px;line-height:1.8"},"⚠️ لطفاً همیشه موجودی فعلی فری‌کش خود را دقیقاً همان‌طور که در اپ نشان داده می‌شود وارد کنید."),
    el("button",{class:"btn full",type:"submit"},"ثبت پیشرفت ✨"),
    el("div",{class:"err"}));
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(form), err = form.querySelector(".err"), b = form.querySelector("[type=submit]");
    err.textContent="";
    const row = {}; for (const k of ["first_name","last_name","game_username","phone_model","game","progress"]) row[k]=(fd.get(k)||"").trim();
    if (Object.values(row).some(x=>!x)) { err.textContent="لطفاً همه فیلدها را پر کنید."; return; }
    const bal = parseMoney(fd.get("balance"));
    if (!isFinite(bal) || bal<0 || bal>=1000000){ err.textContent="لطفاً موجودی را درست وارد کنید، مثلاً 93,83"; return; }
    row.freecash_balance = bal; row.customer_id = cMe.id;
    b.disabled=true; b.textContent="در حال ثبت…";
    const { data, error } = await sb.from("client_updates").insert(row).select().single();
    b.disabled=false; b.textContent="ثبت پیشرفت ✨";
    if (error){ console.error(error); err.textContent="ثبت انجام نشد. دوباره تلاش کنید."; return; }
    cUpdates.unshift(data);
    Object.assign(cMe,{ first_name:data.first_name, last_name:data.last_name, game_username:data.game_username, device:data.phone_model,
      active_game:data.game, progress:data.progress, freecash_balance:data.freecash_balance, last_update_at:data.created_at,

    toast("پیشرفت شما ثبت شد ✨");
    renderClient(true); window.scrollTo({top:0,behavior:"smooth"});

  return form;
}

/* ---------- floating gold embers (background, never blocks taps) ---------- */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("embers"), ctx=cv.getContext("2d");
  let W,H,dpr,parts=[],last=performance.now(),running=true;
  // pre-rendered glowing dot sprite (cheaper than shadowBlur)
  const spr=document.createElement("canvas"); spr.width=spr.height=32;
  const s=spr.getContext("2d"), g=s.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,"rgba(255,246,214,1)"); g.addColorStop(.18,"rgba(243,210,122,.95)");
  g.addColorStop(.45,"rgba(212,160,40,.35)"); g.addColorStop(1,"rgba(212,160,40,0)");
  s.fillStyle=g; s.fillRect(0,0,32,32);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function spawn(p,anywhere){
    p.x=rnd(0,W); p.y=anywhere?rnd(0,H):H+rnd(0,40);
    p.size=rnd(3,9); p.vy=rnd(12,34); p.vx=rnd(-6,6);
    p.wob=rnd(.6,1.8); p.ph=rnd(0,6.28); p.life=0; p.max=rnd(6,14);
    p.fl=rnd(2,6); p.a=rnd(.35,.85); return p;
  }
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(46, Math.max(22, W*H/16000)));
    while(parts.length<n) parts.push(spawn({},true)); parts.length=n;
  }
  function frame(now){
    if(!running) return;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation="lighter";
    for(const p of parts){
      p.life+=dt; p.ph+=dt*p.wob;
      p.y-=p.vy*dt; p.x+=(p.vx+Math.sin(p.ph)*10)*dt;
      const fadeIn=Math.min(1,p.life/1.2), fadeOut=Math.min(1,(p.max-p.life)/2);
      const flick=.65+.35*Math.sin(now/1000*p.fl+p.ph*3);
      const a=p.a*fadeIn*Math.max(0,fadeOut)*flick;
      if(p.life>p.max||p.y<-20){ spawn(p,false); continue; }
      ctx.globalAlpha=a; ctx.drawImage(spr,p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1; requestAnimationFrame(frame);
  }
  addEventListener("resize",size);
  document.addEventListener("visibilitychange",()=>{ running=!document.hidden; if(running){ last=performance.now(); requestAnimationFrame(frame);} });
  size(); requestAnimationFrame(frame);
})();
